name: Puro Browser - Android builds

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante"
        type: choice
        options: ["v1", "v2", "v3", "v4"]
        default: "v1"
        required: true
      target_cpu:
        description: "ABI"
        type: choice
        options: ["arm64", "arm", "x86", "x64"]
        default: "arm64"
        required: true
      build_all_abis:
        description: "Compilar as quatro ABIs"
        type: boolean
        default: false
      chromium_ref:
        description: "SHA/branch do Chromium (vazio usa main)"
        required: false
        default: ""
      publish_release:
        description: "Publicar Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: "Puro ${{ github.event.inputs.variant }} / ${{ matrix.target_cpu }}"
    runs-on: [self-hosted, linux, x64, puro-builder]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        target_cpu: ${{ (github.event.inputs.build_all_abis == 'true' && fromJSON('["arm64","arm","x86","x64"]')) || fromJSON(format('["{0}"]', github.event.inputs.target_cpu)) }}
    env:
      VARIANT: ${{ github.event.inputs.variant }}
      KEYSTORE_V1: ${{ secrets.PURO_KEYSTORE_V1 }}
      KEYSTORE_V2: ${{ secrets.PURO_KEYSTORE_V2 }}
      KEYSTORE_V3: ${{ secrets.PURO_KEYSTORE_V3 }}
      KEYSTORE_V4: ${{ secrets.PURO_KEYSTORE_V4 }}
      KEYSTORE_V1_PASSWORD: ${{ secrets.PURO_KEYSTORE_V1_PASSWORD }}
      KEYSTORE_V2_PASSWORD: ${{ secrets.PURO_KEYSTORE_V2_PASSWORD }}
      KEYSTORE_V3_PASSWORD: ${{ secrets.PURO_KEYSTORE_V3_PASSWORD }}
      KEYSTORE_V4_PASSWORD: ${{ secrets.PURO_KEYSTORE_V4_PASSWORD }}
    steps:
      - name: Checkout scripts Puro
        uses: actions/checkout@v4
        with:
          path: puro-repo
          sparse-checkout: puro

      - name: Verificar recursos
        shell: bash
        run: |
          set -euo pipefail
          echo "CPUs: $(nproc)"
          free -h
          df -h /
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          [ "$AVAIL_GB" -ge 200 ] || { echo "::error::Sao necessarios pelo menos 200 GB livres."; exit 1; }
          [ "$(nproc)" -ge 8 ] || { echo "::error::Sao necessarias pelo menos 8 CPUs."; exit 1; }
          MEM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          [ "$MEM_KB" -ge 16000000 ] || { echo "::error::Sao necessarios pelo menos 16 GB RAM."; exit 1; }

      - name: Instalar depot_tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/puro"
          if [ ! -d "$RUNNER_TEMP/puro/depot_tools/.git" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/puro/depot_tools"
          else
            git -C "$RUNNER_TEMP/puro/depot_tools" pull --ff-only
          fi
          echo "$RUNNER_TEMP/puro/depot_tools" >> "$GITHUB_PATH"

      - name: Sincronizar Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/puro/depot_tools:$PATH"
          cd "$RUNNER_TEMP/puro"
          if [ ! -f .gclient ]; then
            gclient config --name=src "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          REF="${{ github.event.inputs.chromium_ref }}"
          if [ -n "$REF" ]; then
            gclient sync -D --no-history --jobs 16 -r "$REF"
          else
            gclient sync -D --no-history --jobs 16
          fi
          cd src
          sudo ./build/install-build-deps.sh --android
          gclient runhooks

      - name: Aplicar patches Puro (estrito)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/puro/src"
          for p in "$GITHUB_WORKSPACE/puro-repo"/puro/patches/*.patch; do
            [ -f "$p" ] || continue
            echo "Aplicando $(basename "$p")"
            git apply --recount --check "$p"
            git apply --recount "$p"
          done

      - name: Compilar
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/puro-repo/puro/build_puro.sh" \
            "$VARIANT" "${{ matrix.target_cpu }}" \
            "$RUNNER_TEMP/puro/src" "$GITHUB_WORKSPACE/dist"

      - name: Assinar e auditar
        shell: bash
        run: |
          set -euo pipefail
          case "$VARIANT" in
            v1) KS_B64="$KEYSTORE_V1"; KS_PASS="$KEYSTORE_V1_PASSWORD"; ALIAS="puro_v1" ;;
            v2) KS_B64="$KEYSTORE_V2"; KS_PASS="$KEYSTORE_V2_PASSWORD"; ALIAS="puro_v2" ;;
            v3) KS_B64="$KEYSTORE_V3"; KS_PASS="$KEYSTORE_V3_PASSWORD"; ALIAS="puro_v3" ;;
            v4) KS_B64="$KEYSTORE_V4"; KS_PASS="$KEYSTORE_V4_PASSWORD"; ALIAS="puro_v4" ;;
            *) echo "Variante invalida"; exit 2 ;;
          esac
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || { echo "::error::Keystore/ senha nao cadastrada."; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/puro-keystore.jks"
          chmod 600 "$RUNNER_TEMP/puro-keystore.jks"
          BT="$(find "$RUNNER_TEMP/puro/src/third_party/android_sdk/public/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          case "${{ matrix.target_cpu }}" in
            arm64) ABI=arm64-v8a ;;
            arm) ABI=armeabi-v7a ;;
            x86) ABI=x86 ;;
            x64) ABI=x86_64 ;;
          esac
          IN="$GITHUB_WORKSPACE/dist/Puro-$VARIANT-$ABI-unsigned.apk"
          OUT="$GITHUB_WORKSPACE/dist/Puro-$VARIANT-$ABI-signed.apk"
          test -s "$IN"
          "$BT/zipalign" -f -p 4 "$IN" "$OUT"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/puro-keystore.jks" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled true \
            "$OUT"
          rm -f "$IN"
          bash "$GITHUB_WORKSPACE/puro-repo/puro/audit_apk.sh" "$OUT" "$BT" "$VARIANT" "$ABI"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$(basename "$OUT")" "$(basename "$OUT").idsig" > "SHA256SUMS-$ABI.txt")
          rm -f "$RUNNER_TEMP/puro-keystore.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Puro-${{ github.event.inputs.variant }}-${{ matrix.target_cpu }}
          path: |
            dist/Puro-*.apk
            dist/Puro-*.apk.idsig
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event.inputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Puro-${{ github.event.inputs.variant }}-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          set -euo pipefail
          TAG="puro-$VARIANT-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/Puro-*.apk dist/Puro-*.apk.idsig dist/SHA256SUMS-*.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Puro Browser $VARIANT - $(date -u +%Y-%m-%d)" \
            --notes "APK assinado; consulte SHA256SUMS e idsig."
